<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>말씀 영상 — 예그린교회</title>
<meta name="theme-color" content="#1f4a37">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<section class="page-head">
  <div class="wrap">
    <div class="eyebrow">SERMON</div>
    <h1>말씀 영상</h1>
    <p>주일설교와 새벽예배, 성경통독, 성경공부를 다시 볼 수 있어요. 유튜브에 올라오면 자동으로 추가됩니다.</p>
  </div>
</section>

<section class="block">
  <div class="wrap">
    <div class="sermon" style="margin-bottom:48px">
      <div class="video"><iframe id="sermonVideo" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>
      <div>
        <div class="series" id="sermonSeries"></div>
        <div class="title" id="sermonTitle"></div>
        <div class="meta" id="sermonMeta"></div>
        <a class="btn ghost" id="sermonYoutube" target="_blank" rel="noopener">유튜브에서 보기</a>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="grid3" id="list"></div>
    <p style="margin-top:32px;text-align:center"><a class="btn ghost" href="https://www.youtube.com/@yegrin" target="_blank" rel="noopener">예그린교회 유튜브 채널 전체 보기</a></p>
  </div>
</section>

<script src="media.js"></script>
<script src="assets/site.js"></script>
<script>
  (function () {
    var Y = window.Yegreen, L = Y.lists;
    var kinds = ['sunday', 'dawn', 'reading', 'study'].filter(function (k) { return L[k] && L[k].length; });
    var want = new URLSearchParams(location.search).get('v');
    var current = kinds[0];
    kinds.forEach(function (k) { if (L[k].some(function (i) { return i.videoId === want; })) current = k; });

    function play(item, kind) {
      Y.showSermon(item, kind);
      document.querySelectorAll('#list .vcard').forEach(function (b) { b.classList.toggle('on', b.dataset.id === item.videoId); });
    }
    function render(kind, pick) {
      current = kind;
      document.getElementById('tabs').innerHTML = kinds.map(function (k) {
        return '<button data-k="' + k + '"' + (k === kind ? ' class="on"' : '') + '>' + Y.kindName[k] + '</button>';
      }).join('');
      document.getElementById('list').innerHTML = L[kind].map(function (i) { return Y.card(i, kind); }).join('');
      document.querySelectorAll('#tabs button').forEach(function (b) {
        b.addEventListener('click', function () { render(b.dataset.k); });
      });
      document.querySelectorAll('#list .vcard').forEach(function (b) {
        b.addEventListener('click', function () {
          play(L[kind].find(function (i) { return i.videoId === b.dataset.id; }), kind);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });
      play(L[kind].find(function (i) { return i.videoId === pick; }) || L[kind][0], kind);
    }
    if (kinds.length) render(current, want);
  })();
</script>
</body>
</html>
