# 매일 교회 유튜브를 확인해 말씀 영상을 media.js에 반영한다.
name: 말씀 영상 갱신

on:
  schedule:
    - cron: "0 9,15 * * *"   # 한국 시간 매일 오후 6시, 자정
  workflow_dispatch:          # 필요하면 GitHub에서 바로 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_media.py
      - name: 바뀌었으면 저장
        run: |
          if git diff --quiet media.js; then exit 0; fi
          git config user.name "sermon-bot"
          git config user.email "sermon-bot@users.noreply.github.com"
          git add media.js
          git commit -m "말씀 영상 갱신"
          git push
